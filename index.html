<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordenador de Nombres</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 550px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .card h1 {
      color: #3730a3;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .card p.subtitulo {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-group label {
      font-weight: 600;
      font-size: 14px;
      color: #1f2937;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #6366f1;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: #6366f1;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #4f46e5;
    }

    .btn-danger {
      background-color: #ef4444;
      color: #ffffff;
      align-self: flex-start;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }
    
    .output-section {
      border-top: 1px solid #f3f4f6;
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .output-section h2 {
      font-size: 18px;
      color: #3730a3;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background-color: #f9fafb;
      font-size: 15px;
      color: #1f2937;
      resize: none;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Ordenar Arrays de Cadenas</h1>
    <p class="subtitulo">Ingrese nombres en la caja de texto para organizarlos en el área de texto.</p>

    <div class="input-group">
      <label for="inputNombre">Nombre:</label>
      <div class="input-row">
        <input type="text" id="inputNombre" placeholder="Escribe un nombre...">
        <button class="btn btn-primary" onclick="agregarNombre()">Agregar y ordenar</button>
      </div>
    </div>

    <div class="output-section">
      <h2>Nombres ordenados</h2>
      <textarea id="areaResultado" readonly placeholder="Aquí aparecerán los nombres ordenados alfabéticamente..."></textarea>
      <button class="btn btn-danger" onclick="limpiarLista()">Limpiar</button>
    </div>
  </div>

  <script>
    let nombres = [];

    function agregarNombre() {
      const input = document.getElementById("inputNombre");
      const areaTexto = document.getElementById("areaResultado");
      const valor = input.value.trim();

      if (valor !== "") {
        nombres.push(valor);
        nombres.sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
        areaTexto.value = nombres.join("\n");
        input.value = "";
        input.focus();
      }
    }

    function limpiarLista() {
      nombres = [];
      document.getElementById("areaResultado").value = "";
      document.getElementById("inputNombre").value = "";
      document.getElementById("inputNombre").focus();
    }
  </script>

</body>
</html>
